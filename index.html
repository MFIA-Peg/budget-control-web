<script>
'use strict';
const columns = [
 ['order_code','Purchase Order Code'],['department_id','Execution Department ID'],
 ['category_code','Cost Category Code'],['transaction_date','Transaction date'],
 ['subcategory','Subcategory'],['transaction_type','Transaction Type'],
 ['reference','Transaction reference'],['description','Description'],['amount','Amount']
];
const byId = id => document.getElementById(id);
const status = byId('status');
const login = byId('login');
const lookup = byId('lookup');
const review = byId('review');
let session = null;
let busy = false;
function show(tag, content, parent) {
 const node = document.createElement(tag);
 node.textContent = content;
 parent.append(node);
 return node;
}
async function request(config,path,data) {
 const headers = {'apikey':config.key,'Content-Type':'application/json'};
 if (config.token) headers.Authorization = 'Bearer '+config.token;
 const response = await fetch(config.url+path,{method:'POST',headers,body:JSON.stringify(data)});
 const body = await response.text();
 let result = null;
 if (body.trim()) {
  try { result = JSON.parse(body); }
  catch (error) {
   if (response.ok) throw error;
  }
 }
 if (!response.ok) throw new Error(result?.message || result?.msg || 'Request failed ('+response.status+').');
 return result;
}
async function run(button,operation) {
 if (busy) return;
 busy=true;
 button.disabled=true;
 status.textContent='';
 try { await operation(); } catch(error) { status.textContent=error.message; }
 finally { busy=false; button.disabled=false; }
}
const authConfig={url:"https://intacxurcibujhozrxoq.supabase.co",key:"sb_publishable_UQW6bMoj2TKdphp7bU9ldw_QzULlU4D"};
const sessionKey='budget-v2-session';
let refreshPending;
function saveSession(result){
 session={...authConfig,token:result.access_token,refresh:result.refresh_token,expires:Date.now()+result.expires_in*1000};
 sessionStorage.setItem(sessionKey,JSON.stringify({token:session.token,refresh:session.refresh,expires:session.expires}));
}
async function refreshSession(){
 if(!session?.refresh)throw new Error('Sign in again to continue.');
 if(!refreshPending){
  const previous=session;
  refreshPending=request(authConfig,'/auth/v1/token?grant_type=refresh_token',{refresh_token:previous.refresh})
   .then(result=>{if(session===previous)saveSession(result);}).finally(()=>{refreshPending=null;});
 }
 return refreshPending;
}
async function openSession(){
 const access=await rpc('access',{});
 if(!access.finance_admin&&!access.system_admin)throw new Error('This account has no active Budget Controlling role.');
 canManageBudget=access.system_admin;
 configureNavigation(access);
 login.hidden=true;
 byId('logout').hidden=false;
 byId('refresh-workspace').hidden=false;
 status.textContent='Signed in.';
 if(access.system_admin)await openMembers();
 if(access.finance_admin){
  byId('cost-import').hidden=false; byId('batch-review').hidden=false;
  byId('file').disabled=false; byId('upload').disabled=false;
  await openCatalog();
 }
}
login.addEventListener('submit',event=>{
 event.preventDefault();
 run(event.submitter,async()=>{
  const form=new FormData(login);
  try{
   saveSession(await request(authConfig,'/auth/v1/token?grant_type=password',{email:form.get('email').trim(),password:form.get('password')}));
   await openSession();
  }catch(error){
   if(!login.hidden){session=null;sessionStorage.removeItem(sessionKey);}
   throw error;
  }finally{login.elements.password.value='';}
 });
});
byId('logout').onclick=()=>{
 if (busy) return;
 sessionStorage.removeItem(sessionKey);
 byId('refresh-workspace').hidden=true;
 byId('work-nav').hidden=true;
 delete byId('workspace').dataset.view;
 byId('order-analysis').hidden=true;byId('order-analysis').replaceChildren();
 workspaceData=null; workspaceMembers=[]; byId('tab-report').replaceChildren(); byId('tab-report').hidden=true;
 session=null; byId('dashboard').hidden=true; byId('dashboard-results').replaceChildren(); login.hidden=false; byId('logout').hidden=true;
 byId('file').value=''; byId('file').disabled=true; byId('upload').disabled=true;
 byId('billing').hidden=true; byId('billing-content').replaceChildren();
 byId('cash').hidden=true; byId('cash-content').replaceChildren();
 byId('budget').hidden=true; byId('budget-content').replaceChildren();
 byId('closed-orders').hidden=true; byId('closed-orders-content').replaceChildren();
 byId('catalog').hidden=true; byId('catalog-fields').replaceChildren();
 byId('members').hidden=true; byId('member-list').replaceChildren(); resetMemberForm();
 actualCostOrder=null;
 byId('cost-import').hidden=true; byId('batch-review').hidden=true;
 lookup.reset(); review.replaceChildren(); status.textContent='Signed out of this screen.';
};
const rpc=async(name,body)=>{
 if (!session) throw new Error('Sign in first.');
 if(session.expires<=Date.now()+30000)await refreshSession();
 if(!session)throw new Error('Sign in first.');
 return request(session,'/rest/v1/rpc/budget_v2_'+name,body);
};
const memberForm=byId('member-form');
function resetMemberForm(){
 memberForm.reset();
 for(const name of ['email','active','system'])memberForm.elements[name].disabled=false;
}
byId('member-reset').onclick=resetMemberForm;
async function openMembers(){
 const users=await rpc('members',{});
 workspaceMembers=users;
 renderWorkspaceReport();
 const list=byId('member-list');
 list.replaceChildren();
 for(const user of users){
  const roles=[user.finance_admin?'Finance administrator':'',user.system_admin?'System administrator':''].filter(Boolean);
  const item=show('li',[user.display_name,user.email,user.active?'Active':'Suspended',...roles].join(' · ')+' ',list);
  const edit=show('button','Edit',item);
  edit.onclick=()=>{
   resetMemberForm();
   const f=memberForm.elements;
   f.email.value=user.email;
   f.email.disabled=true;
   f.display_name.value=user.display_name;
   f.active.checked=user.active;
   f.finance.checked=user.finance_admin;
   f.system.checked=user.system_admin;
   f.active.disabled=user.self;
   f.system.disabled=user.self;
  };
 }
 byId('members').hidden=false;
}
memberForm.onsubmit=event=>{
 event.preventDefault();
 run(event.submitter,async()=>{
  const f=memberForm.elements;
  await rpc('save_member',{p_email:f.email.value,p_name:f.display_name.value,p_active:f.active.checked,p_finance:f.finance.checked,p_system:f.system.checked});
  resetMemberForm();
  await openMembers();
  status.textContent='User saved.';
 });
};
const nav=byId('work-nav');
let currentOrderAnalysis=null, canManageBudget=false;
let actualCostOrder=null;
function selectWorkspace(view){
 if(view!=='costs')actualCostOrder=null;
 if(view==='costs'){
  const label=byId('cost-import-order');
  label.hidden=!actualCostOrder;
  label.textContent=actualCostOrder?'Purchase order: '+actualCostOrder.code:'';
 }
 if(view!=='order-analysis')currentOrderAnalysis=null;
 byId('workspace').dataset.view=view;
 renderWorkspaceReport();
 for(const button of nav.querySelectorAll('button')){
  if(button.dataset.view===view)button.setAttribute('aria-current','page');
  else button.removeAttribute('aria-current');
 }
}
function configureNavigation(access){
 for(const button of nav.querySelectorAll('button')){
  button.hidden=button.dataset.view==='members'?!access.system_admin:!access.finance_admin;
  button.onclick=()=>{actualCostOrder=null;selectWorkspace(button.dataset.view);};
 }
 selectWorkspace(access.finance_admin?'dashboard':'members');
 nav.hidden=false;
}
function orderStatusButton(parent,order,closed){
 const button=show('button',closed?'Close order':'Reopen order',parent);
 button.type='button';
 button.onclick=()=>{
  if(!window.confirm((closed?'Close ':'Reopen ')+order.code+'?'))return;
  run(button,async()=>{
   await rpc('set_order_closed',{p_order:order.id,p_closed:closed});
   await openCatalog();
   status.textContent=closed?'Moved to the closed purchase order report.':'Moved to open purchase orders.';
  });
 };
}
function renderClosedOrders(data){
 const container=byId('closed-orders-content');
 container.replaceChildren();
 byId('closed-orders').hidden=false;
 const orders=data.orders.filter(order=>order.closed_at).sort((a,b)=>b.closed_at.localeCompare(a.closed_at));
 if(!orders.length){show('p','No closed customer purchase orders.',container);return;}
 const table=show('table','',container),header=table.createTHead().insertRow();
 for(const label of ['Purchase order','Project','Customer','Closed on','Action'])show('th',label,header);
 const body=table.createTBody();
 for(const order of orders){
  const project=data.projects.find(project=>project.id===order.project_id);
  const customer=data.customers.find(customer=>customer.id===project?.customer_id);
  const closed=new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeZone:'Asia/Riyadh'}).format(new Date(order.closed_at));
  const row=body.insertRow();
  for(const value of [order.code,project?.name??'',customer?.name??'',closed])show('td',value,row);
  orderStatusButton(show('td','',row),order,false);
 }
}
const catalogDialogs={};
async function openCatalog() {
 const [data,alerts]=await Promise.all([rpc('catalog',{}),rpc('order_alerts',{})]);
 data.orderAlerts=alerts;
 workspaceData=data;
 const target=byId('catalog-fields');
 target.replaceChildren();
 byId('catalog').hidden=false;
 configureBudget(data);
 configureBilling(data);
 configureCash(data);
 renderClosedOrders(data);
 await configureDashboard(data);
 const projectStatuses={planned:'Planned',active:'Active',on_hold:'On hold',completed:'Completed',cancelled:'Cancelled'};
 const groups=[
  ['department','Departments','departments',[['name','Name']]],
  ['customer','Customers','customers',[['name','Name'],['phone','Contact number'],['approved_email','Approved email'],['relationship_started_on','Relationship start date']]],
  ['project','Projects','projects',[['name','Name'],['department_id','Main department','departments'],['customer_id','Customer','customers'],['status','Status']]],
  ['order','Open customer purchase orders','orders',[['order_number','Purchase order number'],['code','Purchase order code'],['project_id','Project','projects'],['department_id','Primary execution department','departments'],['start_date','Start date'],['end_date','End date'],['contract_value','Value excluding VAT (SAR)']]],
 ];
 for(const [kind,title,collection,fields] of groups){
  const area=show('article','',target);
  if(collection)area.className='catalog-dialog-host';else show('h3',title,area);
  area.dataset.workspace={department:'departments',customer:'customers',department_customer:'customers departments',project:'projects',project_department:'projects',order:'orders',order_department:'orders'}[kind];
  const dialog=show('dialog','',area);
  show('h3',title,dialog);
  const close=show('button','Close',dialog);close.type='button';close.onclick=()=>dialog.close();
  const form=show('form','',dialog);
  const orderActions=show('div','',dialog);
  const attachments=show('div','',dialog);
  const inputs={};
  for(const [key,label,source] of fields){
   const wrapper=show('label',label,form);
   const dateField=key==='start_date'||key==='end_date';
   const input=show(source||key==='status'?'select':'input','',wrapper);

 upload.onclick=async()=>{

  try{

   const cents=label=>{
    const raw=cell(label).replace(/,/g,'')||'0';
    if(!/^-?\d+(?:\.\d{1,2})?$/.test(raw))throw new Error('Invalid '+label+' on voucher '+reference);
    return Math.round(Number(raw)*100);
   };
   const debit=cents('debit'),credit=cents('credit');
   if(!debit&&!credit)continue;
   const department=cell('department'),account=cell('account');
   const key=JSON.stringify([group,department]);
   if(!groups.has(key))groups.set(key,{group,department,rows:[],debit:0,credit:0});
   const entry=groups.get(key);
   entry.debit+=debit;entry.credit+=credit;
   entry.rows.push({source_row:++sourceRow,transaction_date:date,reference,

  }
 }

 if(sourceRow>5000)throw new Error('Include up to 5000 transactions.');

async function parse(file) {

 if (!sheet || columns.some(([key,label],i)=>{const actual=sheet.getRow(1).getCell(i+1).text.trim().toLowerCase();return actual!==label.toLowerCase()&&!(key==='reference'&&actual==='reference');})) throw new Error('Use the Actual Costs template.');
 const rows=[];
 sheet.eachRow((row,number)=>{
  if (number===1) return;
  const item={source_row:number};
  for (const [i,[key]] of columns.entries()) {
   const cell=row.getCell(i+1);
   if (cell.value && typeof cell.value==='object' && !(cell.value instanceof Date && key==='transaction_date')) throw new Error('Row '+number+' contains a formula or unsupported cell.');
   item[key]=cell.value instanceof Date ? cell.value.toISOString().slice(0,10) : cell.text.trim();
  }
  if (!columns.some(([key])=>item[key])) return;
  if (columns.some(([key])=>key!=='subcategory'&&!item[key]) || !/^\d+$/.test(item.department_id) || !/^\d{4}-\d{2}-\d{2}$/.test(item.transaction_date) || !/^-?\d+(\.\d{1,2})?$/.test(item.amount)) throw new Error('Row '+number+' has missing or invalid values.');
  rows.push(item);
 });
 if (!rows.length || rows.length>5000) throw new Error('Include 1 to 5000 cost rows.');
 return rows;
}

 });

   }
  });

   ctx.stroke();

   });
  }

 workbook.onchange=async()=>{

     });

     const fail=()=>{throw new Error(definition.name+' · Excel row '+n+': check department, amount and dates.');};
     const [department,second,third,fourth,fifth,sixth]=fields;

     const linked=departments.find(item=>String(item.id)===key||item.name.toLowerCase()===key);
     const start=dateText(definition.special?fifth:second);
     const end=definition.special?dateText(sixth):start;
     const base=Number(third), factor=Number(fourth);
     const validDate=value=>/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value))&&new Date(value).toISOString().slice(0,10)===value;
     if(!linked||!validDate(start)||!validDate(end)||start>end||third==null||third===''||!Number.isFinite(base))fail();
     if(definition.special&&(!String(second??'').trim()||fourth==null||fourth===''||!Number.isFinite(factor)||base<0||(definition.special==='asset'?factor<=0:factor<0)))fail();

     const value=definition.special==='asset'?Math.min(base,base/factor*days/365):

  const edit=show('button','Edit',buttons), save=show('button','Save',buttons), del=show('button','Delete line',buttons);
  for(const button of [edit,save,del])button.type='button';
  save.hidden=true;
  edit.onclick=()=>{amount.readOnly=false;save.hidden=false;amount.focus();};
  const key={p_revision:line.revision,p_department:line.department_id,p_category:line.category_code,p_date:line.budget_date};
  save.onclick=()=>{if(amount.value&&amount.reportValidity())change(save,{...key,p_action:'edit',p_amount:amount.value});};
  del.onclick=()=>{if(confirm('Delete this budget line?'))change(del,{...key,p_action:'delete_line'});};
  return [line.revision,line.budget_date,data.departments.find(item=>item.id===line.department_id)?.name??line.department_id,
   data.categories.find(item=>item.code===line.category_code)?.name??line.category_code,amount,buttons];
 }));
}
async function openOrderAnalysis(order,mode,from,to){
 const data=workspaceData;
 currentOrderAnalysis={order,mode,from,to};
 selectWorkspace('order-analysis');
 const panel=byId('order-analysis');panel.hidden=false;panel.replaceChildren();
 const back=show('button','Back to purchase orders',panel);back.onclick=()=>selectWorkspace('orders');
 show('h2',({budget:'Order budget',comparison:'Budget vs actual',add:'Add Budget'}[mode])+' · '+order.code,panel);
 const result=show('div','Loading…',panel);
 try{
  if(mode==='comparison'){
   if(!from||!to||from>to)throw new Error('Select a valid reporting period.');
   const rows=await rpc('financial_rows',{p_from:from,p_to:to});
   result.replaceChildren();show('p',from+' – '+to,result);
   renderOrderComparison(result,rows.filter(row=>String(row.order_id)===String(order.id)),data);
   return;
  }
  const budget=await rpc('budget',{p_project:order.project_id});
  if(mode==='add'){renderOrderPlan(result,order,data,budget);return;}
  result.replaceChildren();
  if(canManageBudget)renderBudgetAdmin(result,order,data,budget);
  const versions=budget.versions.filter(version=>version.approved_at).map(version=>version.revision);
  const totals=new Map();
  for(const line of budget.lines){
   if(String(line.order_id)!==String(order.id)||!versions.includes(line.revision))continue;
   if(!totals.has(line.category_code))totals.set(line.category_code,new Map());
   const amounts=totals.get(line.category_code);
   amounts.set(line.revision,(amounts.get(line.revision)??0)+Number(line.change_amount));
  }
  if(!totals.size)show('p','No approved cost budget for this order.',result);
  if(totals.size)reportTable(result,['Cost item',...versions.map(version=>version===0?'Original':'Revision '+version),'Final approved budget'],[...totals].map(([code,amounts])=>[
   data.categories.find(category=>category.code===code)?.name??code,...versions.map(version=>reportMoney.format(amounts.get(version)??0)),
   reportMoney.format([...amounts.values()].reduce((sum,amount)=>sum+amount,0))
  ]));
  const drafts=budget.lines.filter(line=>String(line.order_id)===String(order.id)&&!versions.includes(line.revision));
  if(drafts.length){
   show('h3','Saved draft costs',result);
   reportTable(result,['Date','Department','Cost item','Draft amount'],drafts.map(line=>[
    line.budget_date,data.departments.find(item=>item.id===line.department_id)?.name??line.department_id,
    data.categories.find(item=>item.code===line.category_code)?.name??line.category_code,reportMoney.format(line.change_amount)
   ]));
   const review=show('button','Review draft and approve',result);review.type='button';
   review.onclick=()=>{
    selectWorkspace('budget');
    const picker=byId('budget-project');picker.value=order.id;picker.dispatchEvent(new Event('change'));
   };
  }
  const project=data.projects.find(item=>String(item.id)===String(order.project_id));
  if(project){
   const billing=await rpc('billing',{p_customer:project.customer_id});
   const planned=billing.invoices.filter(invoice=>invoice.planned&&String(invoice.order_id)===String(order.id));
   if(planned.length){
    show('h3','Planned invoices',result);
    reportTable(result,['Invoice','Invoice date','Expected collection','Amount'],planned.map(invoice=>[
     invoice.number,invoice.invoice_date,invoice.expected_receipt_date,reportMoney.format(invoice.amount)
    ]));
   }
  }
 }catch(error){result.textContent=error.message;}
}
function renderWorkspaceReport(){
 const view=byId('workspace').dataset.view, mode=reportModes[view], panel=byId('tab-report');
 panel.replaceChildren();
 if(!mode){renderCatalogOverview(panel,view);return;}
 panel.hidden=!workspaceData;
 if(panel.hidden)return;
 const data=workspaceData, [title,metric,comparison]=mode;
 show('h2',title,panel);
 const year=new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'Asia/Riyadh'}).format(new Date());
 const values=reportFilters[view]??={from:year+'-01-01',to:year+'-12-31'};
 const filters=show('div','',panel);
 filters.className='report-filters';
 for(const [key,label,source] of [['department','Department','departments'],['customer','Customer','customers'],['project','Project','projects'],['order','Purchase order','orders'],['from','From'],['to','To']]){
  const control=show(source?'select':'input','',show('label',label,filters));
  if(source){
   show('option','All',control).value='';
   for(const row of data[source])show('option',row.name??row.code,control).value=row.id;
  }else control.type='date';
  control.value=values[key]??'';
  control.onchange=()=>{values[key]=control.value;refresh();};
 }
 const output=show('div','',panel);
 let requestId=0;
 async function refresh(){
  const current=++requestId, filter={...values};
  output.replaceChildren();
  if(!filter.from||!filter.to||filter.from>filter.to){show('p','Select a valid date range.',output);return;}
  show('p','Loading…',output);
  try{
   const rows=await rpc('financial_rows',{p_from:filter.from,p_to:filter.to});
   if(current!==requestId||!output.isConnected)return;
   const result=rows.filter(row=>[['department','filter_department'],['customer','customer_id'],['project','project_id'],['order','order_id']].every(([key,column])=>!filter[key]||filter[key]===String(row[column])));
   const detail=result.filter(row=>row.metric===metric);
   const compared=result.filter(row=>row.metric===comparison);
   const sum=items=>items.reduce((acc,row)=>acc+Number(row.amount),0);
   const comparisonTitle=Object.values(reportModes).find(([,key])=>key===comparison)[0];
   output.replaceChildren();
   const cards=show('div','',output);cards.className='report-kpis';
   for(const [label,amount] of [[title,sum(detail)],[comparisonTitle,sum(compared)],['Difference',sum(detail)-sum(compared)]])show('p',label+' · '+reportMoney.format(amount),cards);
   if(metric==='actual_invoice')show('p','Outstanding balance · '+reportMoney.format(detail.reduce((acc,row)=>acc+Number(row.remaining),0)),cards);
   const months=[...new Set([...detail,...compared].map(row=>row.event_date.slice(0,7)))].sort();
   show('h3','Monthly comparison',output);
   reportTable(output,['Month',title,comparisonTitle,'Difference'],months.map(month=>{
    const left=sum(detail.filter(row=>row.event_date.startsWith(month))),right=sum(compared.filter(row=>row.event_date.startsWith(month)));
    return [month,...[left,right,left-right].map(value=>reportMoney.format(value))];
   }));
   show('h3','Transactions',output);
   if(!detail.length)show('p','No records match these filters.',output);
   const lookup=(list,id)=>list.find(item=>String(item.id)===String(id));
   reportTable(output,['Date','Project','Order','Department','Reference','Cost category','Details','Amount'],detail.map(row=>[
    row.event_date,lookup(data.projects,row.project_id)?.name??'',lookup(data.orders,row.order_id)?.code??'',
    lookup(data.departments,row.filter_department)?.name??'',row.reference,
    data.categories.find(item=>item.code===row.category)?.name??'',row.detail,reportMoney.format(row.amount)
   ]));
  }catch(error){if(current===requestId&&output.isConnected){output.replaceChildren();show('p',error.message,output);}}
 }
 refresh();
}
async function restoreSession(){
 const saved=sessionStorage.getItem(sessionKey);
 if(!saved)return;
 try{
  session={...authConfig,...JSON.parse(saved)};
  await openSession();
 }catch(error){
  if(!login.hidden){session=null;sessionStorage.removeItem(sessionKey);}
  status.textContent=error.message;
 }
}
function addSelectSearch(){
 for(const select of document.querySelectorAll('select:not([multiple])')){
  if(select.dataset.searchable)continue;
  select.dataset.searchable='true';
  const wrapper=document.createElement('div');wrapper.className='searchable-picker';
  select.after(wrapper);
  const input=show('input','',wrapper);input.type='text';input.autocomplete='off';
  const menu=show('div','',wrapper);menu.className='picker-options';menu.hidden=true;
  input.setAttribute('aria-label',select.labels?.[0]?.firstChild?.textContent?.trim()||'Search options');
  input.setAttribute('aria-expanded','false');
  select.classList.add('picker-native');select.tabIndex=-1;
  function sync(){
   input.disabled=select.disabled;
   input.value=select.selectedOptions[0]?.textContent??'';
   menu.hidden=true;input.setAttribute('aria-expanded','false');
  }
  function render(term){
   menu.replaceChildren();menu.hidden=false;input.setAttribute('aria-expanded','true');
   for(const option of select.options){
    if(option.disabled||option.hidden||!option.textContent.toLowerCase().includes(term))continue;
    const button=show('button',option.textContent,menu);button.type='button';
    button.onclick=()=>{
     select.value=option.value;
     select.dispatchEvent(new Event('change',{bubbles:true}));sync();
     input.focus();sync();
    };
   }
   if(!menu.children.length)show('p','No matching options',menu);
  }
  input.onfocus=()=>{input.select();render('');};
  input.onclick=()=>{if(menu.hidden)render('');};
  input.oninput=()=>render(input.value.trim().toLowerCase());
  input.onkeydown=event=>{
   if(event.key==='Escape'&&!menu.hidden){event.preventDefault();event.stopPropagation();sync();}
   if(event.key==='ArrowDown'){event.preventDefault();if(menu.hidden)render('');menu.querySelector('button')?.focus();}
   if(event.key==='Enter'&&!menu.hidden){event.preventDefault();menu.querySelector('button')?.click();}
  };
  wrapper.onfocusout=event=>{if(!wrapper.contains(event.relatedTarget))sync();};
  select.addEventListener('change',sync);
  select.addEventListener('invalid',()=>input.focus());
  select.form?.addEventListener('reset',()=>queueMicrotask(sync));
  new MutationObserver(sync).observe(select,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
  sync();
 }
}
new MutationObserver(addSelectSearch).observe(document.body,{childList:true,subtree:true});
addSelectSearch();

refreshButton.onclick=()=>run(refreshButton,async()=>{

   if(order)await openOrderAnalysis(order,active.mode,active.from,active.to);

 }
 status.textContent='Data refreshed.';
});
